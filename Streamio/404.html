<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Stremio Text Stream Responder</title>
    <script>
        // Set up the exact paragraph text you want displayed in Stremio
        const globalResponse = {
            streams: [
                {
                    name: "⚠️ SYSTEM NOTICE",
                    title: "TorBox Backup Line\n\nIf TorBox links fail to load or experience downtime, please scroll down past this message and select the pure peer-to-peer standalone Torrentio links listed below.",
                    url: "https://googleapis.com"
                }
            ]
        };

        // Convert the response to text and send it out to Stremio
        const jsonResponse = JSON.stringify(globalResponse);
        
        // This delivers the raw JSON directly to Stremio bypassing the 404 page
        document.open();
        document.write(jsonResponse);
        document.close();
    </script>
</head>
<body></body>
</html>
