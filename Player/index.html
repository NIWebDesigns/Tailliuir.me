<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Tailliuir Player</title>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>

  <style>
    :root{
      --bg:#000;
      --panel:rgba(12,12,12,.90);
      --text:#fff;
      --muted:#c6c6c6;
      --line:rgba(255,255,255,.16);
      --accent:#69d2de;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;background:#000;color:var(--text);font-family:Arial,sans-serif}
    body{overflow:hidden}
    video{
      width:100vw;
      height:100vh;
      object-fit:contain;
      background:#000;
    }
    button,input{
      font:inherit;
      color:inherit;
    }
    .btn{
      height:48px;
      padding:0 14px;
      border-radius:12px;
      border:1px solid var(--line);
      background:#1d1d1d;
      cursor:pointer;
      font-size:16px;
      font-weight:700;
    }
    .btn-primary{
      background:var(--accent);
      color:#001316;
      border:none;
    }
    .bottom-bar{
      position:fixed;
      left:16px;
      right:16px;
      bottom:16px;
      padding:12px 16px;
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:18px;
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      gap:10px;
      z-index:20;
      backdrop-filter:blur(8px);
      font-size:16px;
      transition:opacity .3s;
    }
    .bottom-bar.hidden{opacity:0;pointer-events:none}
    .bottom-bar input[type="url"],
    .bottom-bar input[type="text"]{
      min-width:220px;
      flex:1 1 340px;
      height:48px;
      padding:0 14px;
      background:#111;
      border:1px solid var(--line);
      border-radius:12px;
      font-size:16px;
    }
    .group{
      display:flex;
      align-items:center;
      gap:8px;
      background:#111;
      padding:6px;
      border-radius:12px;
      border:1px solid var(--line);
    }
    .group input{
      height:38px;
      padding:0 10px;
      background:#181818;
      border:1px solid var(--line);
      border-radius:10px;
    }
    .status{
      min-width:150px;
      color:var(--muted);
      white-space:nowrap;
    }
    .top-time,.clock{
      position:fixed;
      top:24px;
      padding:10px 14px;
      background:rgba(12,12,12,.88);
      border:1px solid var(--line);
      border-radius:12px;
      backdrop-filter:blur(8px);
      font-size:18px;
      font-weight:700;
      color:var(--text);
      z-index:10;
      transition:opacity .3s;
    }
    .top-time{right:24px}
    .clock{left:50%;transform:translateX(-50%)}
    .top-time.hidden,.clock.hidden{opacity:0;pointer-events:none}
    :focus-visible{outline:3px solid var(--accent);outline-offset:3px}
    @media (max-width:800px){
      .top-time,.clock{top:16px;font-size:16px;padding:8px 10px}
      .bottom-bar{left:10px;right:10px;bottom:10px}
    }
  </style>
</head>
<body>
  <video id="video" playsinline webkit-playsinline preload="metadata" controls></video>

  <div class="top-time" id="time">00:00:00 / 00:00:00</div>
  <div class="clock" id="clock"></div>

  <div class="bottom-bar" id="bottomBar">
    <input id="urlInput" type="url" placeholder="Paste media / .m3u / .m3u8 / .mpd URL" />
    <button class="btn btn-primary" id="loadBtn">Load</button>

    <div class="group">
      <input id="jumpInput" type="text" placeholder="01:23 or 0123" />
      <button class="btn" id="jumpBtn">Jump</button>
    </div>

    <div class="status" id="status">No media loaded</div>
  </div>

  <script>
    const video = document.getElementById("video");
    const bottomBar = document.getElementById("bottomBar");
    const timeEl = document.getElementById("time");
    const clockEl = document.getElementById("clock");
    const urlInput = document.getElementById("urlInput");
    const loadBtn = document.getElementById("loadBtn");
    const jumpInput = document.getElementById("jumpInput");
    const jumpBtn = document.getElementById("jumpBtn");
    const status = document.getElementById("status");

    let barVisible = true;
    let tapTimeout;
    let hls = null;
    let dashPlayer = null;

    function setStatus(text) {
      status.textContent = text;
    }

    function cleanupPlayer() {
      if (hls) {
        hls.destroy();
        hls = null;
      }
      if (dashPlayer) {
        dashPlayer.reset();
        dashPlayer = null;
      }
      while (video.firstChild) video.removeChild(video.firstChild);
      video.pause();
      video.removeAttribute("src");
      video.load();
    }

    function toggleBar(force) {
      barVisible = typeof force === "boolean" ? force : !barVisible;
      bottomBar.classList.toggle("hidden", !barVisible);
    }

    function updateTopVisibility() {
      const playing = !video.paused && !video.ended;
      timeEl.classList.toggle("hidden", playing);
      clockEl.classList.toggle("hidden", playing);
    }

    function hideBarDelayed() {
      clearTimeout(tapTimeout);
      if (!video.paused && !video.ended) {
        tapTimeout = setTimeout(() => {
          if (barVisible) toggleBar(false);
        }, 3000);
      }
    }

    function fmtHMS(t) {
      if (!isFinite(t)) return "00:00:00";
      const h = Math.floor(t / 3600);
      const m = Math.floor((t % 3600) / 60);
      const s = Math.floor(t % 60);
      return [h, m, s].map(v => String(v).padStart(2, "0")).join(":");
    }

    function updateTime() {
      timeEl.textContent = `${fmtHMS(video.currentTime)} / ${fmtHMS(video.duration)}`;
    }

    function clampTime(t) {
      return Math.max(0, Math.min(isFinite(video.duration) ? video.duration : t, t));
    }

    function seekTo(t) {
      if (!isFinite(video.duration)) {
        setStatus("Wait for media to load");
        return;
      }
      video.currentTime = clampTime(t);
      updateTime();
    }

    function parseJump(value) {
      const v = (value || "").trim().replace(/[^0-9:]/g, "");
      if (!v) return null;
      if (v.includes(":")) {
        const parts = v.split(":").map(Number);
        if (parts.some(n => Number.isNaN(n))) return null;
        if (parts.length === 2) return parts[0] * 60 + parts[1];
        if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
        return null;
      }
      if (v.length === 4) {
        const h = parseInt(v.slice(0, 2), 10);
        const m = parseInt(v.slice(2, 4), 10);
        return h * 3600 + m * 60;
      }
      return Number(v);
    }

    function looksLikeM3U8(url) {
      return /\.m3u8(\?|#|$)/i.test(url);
    }

    function looksLikeM3U(url) {
      return /\.m3u(\?|#|$)/i.test(url);
    }

    function looksLikeMPD(url) {
      return /\.mpd(\?|#|$)/i.test(url);
    }

    async function tryFetch(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error("Fetch failed");
      return {
        text: await res.text(),
        contentType: res.headers.get("content-type") || ""
      };
    }

    async function loadM3UPlaylist(text, baseUrl = location.href) {
      const lines = text
        .split(/\r?\n/)
        .map(l => l.trim())
        .filter(l => l && !l.startsWith("#"));

      if (!lines.length) {
        setStatus("Playlist is empty");
        return;
      }

      const firstEntry = lines[0];
      const resolved = new URL(firstEntry, baseUrl).href;
      await loadMedia(resolved);
      setStatus(`Loaded playlist item 1 of ${lines.length}`);
    }

    async function loadHls(url) {
      cleanupPlayer();

      if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = url;
        video.load();
        setStatus("Loading HLS...");
        return;
      }

      if (window.Hls && Hls.isSupported()) {
        hls = new Hls({ enableWorker: true });
        hls.loadSource(url);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          setStatus("HLS ready");
        });

        hls.on(Hls.Events.ERROR, (_, data) => {
          if (data?.fatal) {
            setStatus("HLS error");
          }
        });
        return;
      }

      setStatus("HLS not supported in this browser");
    }

    async function loadDash(url) {
      cleanupPlayer();

      if (!window.dashjs) {
        setStatus("DASH library missing");
        return;
      }

      dashPlayer = dashjs.MediaPlayer().create();
      dashPlayer.initialize(video, url, false);
      setStatus("Loading DASH...");
    }

    async function loadDirect(url) {
      cleanupPlayer();
      video.src = url;
      video.load();
      setStatus("Loading...");
    }

    async function detectAndLoadByContent(url) {
      const { text, contentType } = await tryFetch(url);

      if (
        text.includes("#EXTM3U") &&
        (text.includes("#EXT-X-") || /mpegurl|vnd\.apple\.mpegurl/i.test(contentType))
      ) {
        await loadHls(url);
        return true;
      }

      if (text.includes("#EXTM3U")) {
        await loadM3UPlaylist(text, url);
        return true;
      }

      if (
        text.includes("<MPD") ||
        /dash\+xml|application\/mpd/i.test(contentType)
      ) {
        await loadDash(url);
        return true;
      }

      return false;
    }

    async function loadMedia(url) {
      const clean = (url || "").trim();
      if (!clean) {
        setStatus("Paste a media URL");
        return;
      }

      if (/^magnet:/i.test(clean)) {
        setStatus("Magnet links are not supported");
        return;
      }

      if (/youtube\.com|youtu\.be/i.test(clean)) {
        setStatus("YouTube page URLs are not direct media links");
        return;
      }

      if (looksLikeM3U8(clean)) {
        await loadHls(clean);
        return;
      }

      if (looksLikeMPD(clean)) {
        await loadDash(clean);
        return;
      }

      if (looksLikeM3U(clean)) {
        setStatus("Loading playlist...");
        const { text } = await tryFetch(clean);
        await loadM3UPlaylist(text, clean);
        return;
      }

      try {
        const detected = await detectAndLoadByContent(clean);
        if (detected) return;
      } catch {}

      await loadDirect(clean);

      video.addEventListener("error", async function retryHandler() {
        video.removeEventListener("error", retryHandler);
        try {
          const detected = await detectAndLoadByContent(clean);
          if (!detected) {
            setStatus("Could not play this source");
          }
        } catch {
          setStatus("Could not play this source");
        }
      }, { once: true });
    }

    async function safeLoadUrl() {
      try {
        await loadMedia(urlInput.value);
      } catch (err) {
        console.error(err);
        setStatus("Could not load URL");
      }
    }

    loadBtn.addEventListener("click", safeLoadUrl);

    urlInput.addEventListener("keydown", e => {
      if (e.key === "Enter") safeLoadUrl();
    });

    jumpBtn.addEventListener("click", () => {
      const secs = parseJump(jumpInput.value);
      if (secs === null) {
        setStatus("Enter 0123, 1:23, or 01:02:03");
        return;
      }
      seekTo(secs);
      setStatus("Jumped to " + fmtHMS(secs));
    });

    jumpInput.addEventListener("keydown", e => {
      if (e.key === "Enter") jumpBtn.click();
    });

    function updateClock() {
      clockEl.textContent = new Date().toLocaleTimeString("en-GB", { hour12: false });
    }
    updateClock();
    setInterval(updateClock, 1000);

    video.addEventListener("loadedmetadata", () => {
      setStatus("Ready");
      updateTime();
      updateTopVisibility();
    });

    video.addEventListener("timeupdate", updateTime);

    video.addEventListener("play", () => {
      setStatus("Playing");
      updateTopVisibility();
      hideBarDelayed();
    });

    video.addEventListener("pause", () => {
      setStatus("Paused");
      updateTopVisibility();
      toggleBar(true);
    });

    video.addEventListener("waiting", () => setStatus("Buffering"));

    video.addEventListener("ended", () => {
      setStatus("Ended");
      updateTopVisibility();
      toggleBar(true);
    });

    video.addEventListener("error", () => {
      updateTopVisibility();
    });

    document.addEventListener("click", e => {
      if (e.target.closest(".bottom-bar")) return;
      toggleBar();
      updateTopVisibility();
      hideBarDelayed();
    });

    document.addEventListener("keydown", async e => {
      const tag = document.activeElement?.tagName;
      const typing = tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT";

      if (!typing && e.code === "Space") {
        e.preventDefault();
        try {
          if (video.paused) await video.play();
          else video.pause();
        } catch {}
      }

      if (!typing && e.key === "ArrowLeft") {
        e.preventDefault();
        seekTo(video.currentTime - 10);
      }

      if (!typing && e.key === "ArrowRight") {
        e.preventDefault();
        seekTo(video.currentTime + 10);
      }
    });
  </script>
</body>
</html>
