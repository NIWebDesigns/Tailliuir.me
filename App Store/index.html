<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tailliuir Bannedapps</title>
  <style>
    :root{
      --bg:#f5f5f7;
      --card:#fff;
      --soft:#f2f2f7;
      --line:#e5e5ea;
      --text:#1d1d1f;
      --muted:#6e6e73;
      --blue:#0071e3;
      --blue-dark:#0058b0;
      --shadow:0 8px 30px rgba(0,0,0,.06);
      --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:var(--sans);
    }

    .wrap{
      max-width:980px;
      margin:0 auto;
      padding:24px 16px 60px;
    }

    .page-title{
      margin:0 0 22px;
      font-size:2.2rem;
      font-weight:800;
      letter-spacing:-0.06em;
      text-align:center;
    }

    .app-store-list{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:28px;
      overflow:hidden;
      box-shadow:var(--shadow);
    }

    .app-item{
      display:flex;
      align-items:center;
      gap:14px;
      padding:16px 18px;
      border-bottom:1px solid var(--line);
      cursor:pointer;
      transition:background .15s ease;
    }

    .app-item:last-child{
      border-bottom:none;
    }

    .app-item:hover{
      background:#fafafe;
    }

    .app-icon{
      width:72px;
      height:72px;
      border-radius:18px;
      overflow:hidden;
      border:1px solid #d9dce3;
      background:#fff;
      flex:none;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:800;
      font-size:1rem;
      color:var(--blue);
      text-align:center;
      padding:8px;
    }

    .app-icon img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .app-copy{
      min-width:0;
      flex:1;
    }

    .app-name{
      margin:0 0 4px;
      font-size:1.1rem;
      font-weight:800;
      letter-spacing:-0.03em;
      text-transform:capitalize;
    }

    .app-desc{
      margin:0;
      color:var(--muted);
      font-size:.95rem;
      line-height:1.5;
    }

    .get-btn{
      min-width:76px;
      height:34px;
      border:none;
      border-radius:999px;
      background:var(--soft);
      color:var(--blue);
      font-weight:800;
      font-size:.9rem;
      cursor:pointer;
      flex:none;
    }

    .modal{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.38);
      display:none;
      align-items:flex-end;
      justify-content:center;
      z-index:1000;
      backdrop-filter:blur(8px);
    }

    .modal.open{
      display:flex;
    }

    .sheet{
      width:min(860px,100%);
      max-height:92vh;
      overflow:auto;
      background:#fff;
      border-radius:28px 28px 0 0;
      padding:24px 20px 28px;
      box-shadow:0 -10px 40px rgba(0,0,0,.16);
      animation:slideUp .22s ease;
    }

    @keyframes slideUp{
      from{transform:translateY(24px);opacity:.7}
      to{transform:translateY(0);opacity:1}
    }

    .sheet-handle{
      width:44px;
      height:5px;
      background:#d7d7dc;
      border-radius:999px;
      margin:0 auto 16px;
    }

    .sheet-top{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:16px;
      margin-bottom:18px;
    }

    .detail-head{
      display:flex;
      gap:16px;
      align-items:flex-start;
    }

    .detail-icon{
      width:94px;
      height:94px;
      border-radius:22px;
      overflow:hidden;
      border:1px solid #d9dce3;
      background:#fff;
      flex:none;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:800;
      font-size:1.1rem;
      color:var(--blue);
      text-align:center;
      padding:10px;
    }

    .detail-icon img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .detail-info h4{
      margin:0 0 6px;
      font-size:1.75rem;
      line-height:1;
      letter-spacing:-0.05em;
      text-transform:capitalize;
    }

    .detail-info p{
      margin:0;
      color:var(--muted);
      line-height:1.6;
    }

    .close{
      border:none;
      background:var(--soft);
      color:var(--text);
      width:38px;
      height:38px;
      border-radius:50%;
      cursor:pointer;
      font-size:18px;
      flex:none;
    }

    .detail-actions{
      margin:18px 0 20px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .btn{
      min-height:40px;
      padding:0 16px;
      border-radius:999px;
      border:none;
      text-decoration:none;
      font-size:.92rem;
      font-weight:800;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
    }

    .btn-primary{
      background:var(--blue);
      color:#fff;
    }

    .btn-primary:hover{
      background:var(--blue-dark);
    }

    .btn-soft{
      background:var(--soft);
      color:var(--blue);
      border:1px solid #e1e1e8;
    }

    .info-panel{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
    }

    .detail-box{
      background:var(--soft);
      border:1px solid #e5e5ea;
      border-radius:22px;
      padding:16px;
    }

    .detail-box span{
      display:block;
      font-size:.76rem;
      color:var(--muted);
      text-transform:uppercase;
      letter-spacing:.05em;
      font-weight:800;
      margin-bottom:7px;
    }

    .detail-box strong{
      display:block;
      font-size:1rem;
      line-height:1.5;
      word-break:break-word;
    }

    .copy-login{
      margin-top:10px;
      background:#fff;
      border:1px solid #d8d8de;
      color:var(--blue);
      border-radius:999px;
      padding:8px 12px;
      font-size:.84rem;
      font-weight:800;
      cursor:pointer;
    }

    @media (max-width:760px){
      .page-title{font-size:2rem}
      .app-item{align-items:flex-start}
      .sheet-top,
      .detail-head{
        flex-direction:column;
      }
      .info-panel{
        grid-template-columns:1fr;
      }
      .detail-actions{
        flex-direction:column;
      }
      .btn{
        width:100%;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 class="page-title">Tailliuir Bannedapps</h1>
    <div class="app-store-list" id="app-list"></div>
  </div>

  <div class="modal" id="app-modal">
    <div class="sheet">
      <div class="sheet-handle"></div>

      <div class="sheet-top">
        <div class="detail-head">
          <div class="detail-icon" id="modal-icon"></div>
          <div class="detail-info">
            <h4 id="modal-name"></h4>
            <p id="modal-desc"></p>
          </div>
        </div>
        <button class="close" id="close-modal" aria-label="Close">×</button>
      </div>

      <div class="detail-actions" id="modal-actions"></div>

      <div class="info-panel">
        <div class="detail-box">
          <span>Username</span>
          <strong id="modal-username"></strong>
          <button class="copy-login" id="copy-username">Copy Username</button>
        </div>
        <div class="detail-box">
          <span>Password</span>
          <strong id="modal-password"></strong>
          <button class="copy-login" id="copy-password">Copy Password</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const apps = [
      {
        name: "streamfire",
        icon: "PASTE_IMAGE_URL_HERE",
        iconText: "SF",
        desc: "Streaming app option.",
        username: "streamfire_user@example.com",
        password: "StreamfirePass123!",
        buttons: [
          { label: "Download", url: "PASTE_DOWNLOAD_URL_HERE" }
        ]
      },
      {
        name: "bee tv",
        icon: "PASTE_IMAGE_URL_HERE",
        iconText: "BT",
        desc: "Streaming app option.",
        username: "beetv_user@example.com",
        password: "BeeTVPass123!",
        buttons: [
          { label: "Download", url: "PASTE_DOWNLOAD_URL_HERE" }
        ]
      },
      {
        name: "filmplus",
        icon: "PASTE_IMAGE_URL_HERE",
        iconText: "FP",
        desc: "Streaming app option.",
        username: "filmplus_user@example.com",
        password: "FilmplusPass123!",
        buttons: [
          { label: "Download", url: "PASTE_DOWNLOAD_URL_HERE" }
        ]
      },
      {
        name: "ukturks",
        icon: "PASTE_IMAGE_URL_HERE",
        iconText: "UK",
        desc: "Streaming app option.",
        username: "ukturks_user@example.com",
        password: "UKTurksPass123!",
        buttons: [
          { label: "Download", url: "PASTE_DOWNLOAD_URL_HERE" }
        ]
      },
      {
        name: "nova tv",
        icon: "PASTE_IMAGE_URL_HERE",
        iconText: "NT",
        desc: "Streaming app option.",
        username: "novatv_user@example.com",
        password: "NovaTVPass123!",
        buttons: [
          { label: "Download", url: "PASTE_DOWNLOAD_URL_HERE" }
        ]
      },
      {
        name: "cyberflix",
        icon: "PASTE_IMAGE_URL_HERE",
        iconText: "CF",
        desc: "Streaming app option.",
        username: "cyberflix_user@example.com",
        password: "CyberflixPass123!",
        buttons: [
          { label: "Download", url: "PASTE_DOWNLOAD_URL_HERE" }
        ]
      },
      {
        name: "vivatv",
        icon: "PASTE_IMAGE_URL_HERE",
        iconText: "VV",
        desc: "Streaming app option.",
        username: "vivatv_user@example.com",
        password: "VivaTVPass123!",
        buttons: [
          { label: "Download", url: "PASTE_DOWNLOAD_URL_HERE" }
        ]
      },
      {
        name: "streamflix",
        icon: "PASTE_IMAGE_URL_HERE",
        iconText: "SX",
        desc: "Streaming app option.",
        username: "streamflix_user@example.com",
        password: "StreamflixPass123!",
        buttons: [
          { label: "Download", url: "PASTE_DOWNLOAD_URL_HERE" }
        ]
      },
      {
        name: "reeze",
        icon: "PASTE_IMAGE_URL_HERE",
        iconText: "RZ",
        desc: "Streaming app option.",
        username: "reeze_user@example.com",
        password: "ReezePass123!",
        buttons: [
          { label: "Download", url: "PASTE_DOWNLOAD_URL_HERE" }
        ]
      }
    ];

    const list = document.getElementById("app-list");
    const modal = document.getElementById("app-modal");
    const modalIcon = document.getElementById("modal-icon");
    const modalName = document.getElementById("modal-name");
    const modalDesc = document.getElementById("modal-desc");
    const modalActions = document.getElementById("modal-actions");
    const modalUsername = document.getElementById("modal-username");
    const modalPassword = document.getElementById("modal-password");
    const closeModalBtn = document.getElementById("close-modal");
    const copyUsernameBtn = document.getElementById("copy-username");
    const copyPasswordBtn = document.getElementById("copy-password");

    let currentApp = null;

    function iconMarkup(app){
      const fallback = app.iconText || app.name.slice(0,2).toUpperCase();
      if (!app.icon || app.icon.includes("PASTE_IMAGE_URL_HERE")) {
        return `<span>${fallback}</span>`;
      }
      return `<img src="${app.icon}" alt="${app.name} logo" onerror="this.parentElement.innerHTML='&lt;span&gt;${fallback}&lt;/span&gt;'">`;
    }

    apps.forEach((app) => {
      const item = document.createElement("div");
      item.className = "app-item";

      item.innerHTML = `
        <div class="app-icon">
          ${iconMarkup(app)}
        </div>
        <div class="app-copy">
          <h4 class="app-name">${app.name}</h4>
          <p class="app-desc">${app.desc}</p>
        </div>
        <button class="get-btn" type="button">View</button>
      `;

      item.addEventListener("click", () => openModal(app));
      list.appendChild(item);
    });

    function openModal(app){
      currentApp = app;
      modalIcon.innerHTML = iconMarkup(app);
      modalName.textContent = app.name;
      modalDesc.textContent = app.desc;
      modalUsername.textContent = app.username || "Not provided";
      modalPassword.textContent = app.password || "Not provided";
      modalActions.innerHTML = "";

      app.buttons.forEach((btn, i) => {
        const a = document.createElement("a");
        a.className = i === 0 ? "btn btn-primary" : "btn btn-soft";
        a.href = btn.url || "#";
        a.target = "_blank";
        a.rel = "noopener";
        a.textContent = btn.label;
        modalActions.appendChild(a);
      });

      modal.classList.add("open");
    }

    function closeModal(){
      modal.classList.remove("open");
    }

    closeModalBtn.addEventListener("click", closeModal);

    modal.addEventListener("click", (e) => {
      if (e.target === modal) closeModal();
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeModal();
    });

    async function copyText(text, button){
      try{
        await navigator.clipboard.writeText(text);
        const old = button.textContent;
        button.textContent = "Copied";
        setTimeout(() => button.textContent = old, 1200);
      }catch{
        alert("Could not copy");
      }
    }

    copyUsernameBtn.addEventListener("click", () => {
      if (currentApp?.username) copyText(currentApp.username, copyUsernameBtn);
    });

    copyPasswordBtn.addEventListener("click", () => {
      if (currentApp?.password) copyText(currentApp.password, copyPasswordBtn);
    });
  </script>
</body>
</html>
